<html lang="en">
<head>

    <!-- html2pdf library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 15px;
            color: #1f2937;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-top: 0;
            color: #111827;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
            text-align: center;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input[type="text"], input[type="date"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[list] {
            cursor: pointer;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23666" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
            background-repeat: no-repeat;
            background-position: right 8px center;
            padding-right: 30px;
        }
        input[list]:focus {
            cursor: text;
        }
        input[readonly] {
            background-color: #e5e7eb;
            cursor: not-allowed;
            font-weight: bold;
        }
        /* Mobile-responsive table wrapper */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
        }
        table {
            width: 100%;
            min-width: 650px; 
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid #e5e7eb;
        }
        th {
            background-color: #f9fafb;
            font-weight: 600;
            white-space: nowrap;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            padding: 12px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        .btn-remove {
            background-color: #ef4444;
            padding: 8px 10px;
            font-size: 12px;
        }
        .btn-remove:hover {
            background-color: #dc2626;
        }
        .total-container {
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 0;
        }
        /* Elements to hide during PDF generation */
        .html2pdf__container .no-print {
            display: none !important;
        }
        /* Styling for the temporary text spans inserted during PDF generation */
        .print-text {
            font-size: 14px;
            font-family: inherit;
            display: inline-block;
            padding: 5px 0;
        }
    </style>
</head>

<div class="container" id="printableArea">
    <h2>Kairali Traders sales order</h2>
    
    <form id="saleOrderForm">
        <div class="form-group">
            <label for="orderDate">Order Date:</label>
            <input type="date" id="orderDate" required>
        </div>

        <div class="form-group">
            <label for="sundryDebtor">Sundry Debtor:</label>
            <input type="text" id="sundryDebtor" name="sundryDebtor" list="debtorList" required placeholder="-- Search, Select or Type Custom Debtor --" autocomplete="off">
        </div>

        <div class="form-group">
            <label>Order Items:</label>
            <div class="table-responsive">
                <table id="itemsTable">
                    <thead>
                        <tr>
                            <th style="width: 40%;">Stock item name</th>
                            <th style="width: 15%;">Qty</th>
                            <th style="width: 15%;">Rate (₹)</th>
                            <th style="width: 20%;">Amount (₹)</th>
                            <th style="width: 10%;" class="no-print">Action</th>
                        </tr>
                    </thead>
                    <tbody id="itemsBody">
                        <tr>
                            <td>
                                <input type="text" class="stock-item" list="stockList" required placeholder="-- Search, Select or Type Custom Item --" autocomplete="off">
                            </td>
                            <td><input type="number" class="qty" min="1" step="0.01" required></td>
                            <td><input type="number" step="0.01" class="rate" required></td>
                            <td><input type="number" class="amount" readonly placeholder="0.00"></td>
                            <td class="no-print"><button type="button" class="btn btn-remove" onclick="removeRow(this)">Remove</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="total-container">
                Total Amount: ₹<span id="grandTotal">0.00</span>
            </div>
            
            <button type="button" class="btn no-print" onclick="addRow()">+ Add Item</button>
        </div>

        <div class="form-group no-print">
            <button type="submit" id="submitBtn" class="btn" style="width: 100%; font-size: 16px; margin-top: 15px;">Step 1: Save PDF</button>
        </div>
    </form>
</div>

<script>
    const TARGET_WHATSAPP_NUMBER = "916238818630"; 
    let currentWhatsappUrl = "";

    document.getElementById('orderDate').valueAsDate = new Date();

    document.getElementById('itemsBody').addEventListener('input', function(e) {
        if (e.target.classList.contains('qty') || e.target.classList.contains('rate')) {
            const row = e.target.closest('tr');
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const rate = parseFloat(row.querySelector('.rate').value) || 0;
            const amountField = row.querySelector('.amount');
            
            amountField.value = (qty * rate).toFixed(2);
            calculateGrandTotal();
        }
    });

    function calculateGrandTotal() {
        const amounts = document.querySelectorAll('.amount');
        let total = 0;
        amounts.forEach(input => {
            total += parseFloat(input.value) || 0;
        });
        document.getElementById('grandTotal').innerText = total.toFixed(2);
    }

    function addRow() {
        const tbody = document.getElementById('itemsBody');
        const firstRow = tbody.querySelector('tr').cloneNode(true);
        
        firstRow.querySelector('.stock-item').value = "";
        firstRow.querySelector('.qty').value = "";
        firstRow.querySelector('.rate').value = "";
        firstRow.querySelector('.amount').value = "";
        
        tbody.appendChild(firstRow);
    }

    function removeRow(button) {
        const tbody = document.getElementById('itemsBody');
        if (tbody.children.length > 1) {
            button.closest('tr').remove();
            calculateGrandTotal();
        } else {
            alert("At least one item is required.");
        }
    }

    function resetFormUI() {
        document.getElementById('saleOrderForm').reset();
        document.getElementById('orderDate').valueAsDate = new Date();
        document.getElementById('grandTotal').innerText = "0.00";
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = "Step 1: Save PDF";
        submitBtn.style.backgroundColor = "#2563eb"; // Original Blue
        submitBtn.disabled = false;
    }

    // iPhone Fix: Flatten inputs to plain text before generating PDF to prevent iOS memory crash
    function flattenInputsForPDF() {
        const inputs = document.querySelectorAll('#printableArea input:not([type="button"]):not([type="submit"])');
        inputs.forEach(input => {
            const span = document.createElement('span');
            span.className = 'print-text';
            span.innerText = input.value;
            // Hide the actual input and insert the text span
            input.style.display = 'none';
            input.parentNode.insertBefore(span, input);
        });
    }

    // Revert inputs back to normal after PDF is generated
    function restoreInputsAfterPDF() {
        const spans = document.querySelectorAll('.print-text');
        spans.forEach(span => span.remove());
        const inputs = document.querySelectorAll('#printableArea input');
        inputs.forEach(input => input.style.display = '');
    }

    document.getElementById('saleOrderForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');

        // Step 2 Action
        if (submitBtn.innerText.includes("Step 2")) {
            window.location.href = currentWhatsappUrl;
            resetFormUI();
            return;
        }

        // Step 1 Action
        submitBtn.innerText = "Generating PDF... Please wait";
        submitBtn.disabled = true;
        
        const debtorName = document.getElementById('sundryDebtor').value.trim();
        const date = document.getElementById('orderDate').value;
        const total = document.getElementById('grandTotal').innerText;
        const element = document.getElementById('printableArea');

        // Apply iPhone memory fix by flattening form elements
        flattenInputsForPDF();

        const filename = `Kairali_Traders_Sale_Order_${debtorName.replace(/\s+/g, '_')}_${date}.pdf`;
        
        const opt = {
            margin:       10,
            filename:     filename,
            image:        { type: 'jpeg', quality: 0.95 },
            html2canvas:  { scale: 2, useCORS: true }, 
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        setTimeout(() => {
            html2pdf().set(opt).from(element).save().then(() => {
                
                // Restore form back to normal
                restoreInputsAfterPDF();

                const message = `Hello, here is the new Sale Order for ${debtorName} dated ${date}. The total amount is ₹${total}.`;
                currentWhatsappUrl = `https://wa.me/${TARGET_WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
                
                submitBtn.innerText = "Step 2: Send via WhatsApp";
                submitBtn.style.backgroundColor = "#25D366"; // WhatsApp Green
                submitBtn.disabled = false;

            }).catch(err => {
                restoreInputsAfterPDF();
                alert("Failed to generate PDF. Memory limit exceeded.");
                console.error(err);
                resetFormUI();
            });
        }, 100);
    });
</script>
